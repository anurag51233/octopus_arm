controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Plane_002_joint
      - Plane_003_joint
      - Plane_004_joint
      - Plane_005_joint
      - Plane_006_joint
      - Plane_007_joint
      - Plane_008_joint
      - Plane_009_joint
      - Plane_010_joint
      - Plane_011_joint
      # - Plane_012_joint
      # - Plane_013_joint
      # - Plane_014_joint
      # - Plane_015_joint
      # - Plane_016_joint
      # - Plane_017_joint
      # - Plane_018_joint
      # - Plane_019_joint
      # - Plane_020_joint
      # - Plane_021_joint
      # - Plane_022_joint

    write_op_modes:
      - Plane_002_joint
      - Plane_003_joint
      - Plane_004_joint
      - Plane_005_joint
      - Plane_006_joint
      - Plane_007_joint
      - Plane_008_joint
      - Plane_009_joint
      - Plane_010_joint
      - Plane_011_joint
      # - Plane_012_joint
      # - Plane_013_joint
      # - Plane_014_joint
      # - Plane_015_joint
      # - Plane_016_joint
      # - Plane_017_joint
      # - Plane_018_joint
      # - Plane_019_joint
      # - Plane_020_joint
      # - Plane_021_joint
      # - Plane_022_joint
    
    interface_name: position

    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    hardware_state_has_offset: true
    deduce_states_from_derivatives: true
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0